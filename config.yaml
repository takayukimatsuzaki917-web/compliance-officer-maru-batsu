# =============================================================
# アプリ設定ファイル
#   ※ 合格ライン・制限時間は「仮の値」です。
#     生命保険協会の公式の試験要項で確認し、必要に応じて変更してください。
# =============================================================

exam:
  # 模試1回あたりの出題数
  num_questions: 25
  # 合格ライン（正答率。0.70 = 70%）※仮値
  pass_ratio: 0.70
  # 制限時間（分）※仮値
  time_limit_minutes: 30

paths:
  # 問題データ（JSON）を置くフォルダ
  questions_dir: data/questions
  # 学習履歴の保存先（.gitignore 対象）
  history_file: history.json
